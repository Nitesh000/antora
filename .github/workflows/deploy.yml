name: Deploy

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      NEXT_PUBLIC_APP_URL: https://antora.thecodintant.in

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Vercel CLI
        run: pnpm add -g vercel@latest

      - name: Debug secrets
        run: |
          echo "VERCEL_ORG_ID length: $(echo -n "$VERCEL_ORG_ID" | wc -c)"
          echo "VERCEL_PROJECT_ID length: $(echo -n "$VERCEL_PROJECT_ID" | wc -c)"
          echo "VERCEL_TOKEN length: $(echo -n "${{ secrets.VERCEL_TOKEN }}" | wc -c)"
          echo "ORG_ID prefix: $(echo "$VERCEL_ORG_ID" | cut -c1-5)"
          echo "PROJECT_ID prefix: $(echo "$VERCEL_PROJECT_ID" | cut -c1-5)"

      - name: Link Vercel project
        run: |
          mkdir -p .vercel
          echo '{"orgId":"'"$VERCEL_ORG_ID"'","projectId":"'"$VERCEL_PROJECT_ID"'"}' > .vercel/project.json
          echo "project.json content:"
          cat .vercel/project.json

      - name: Test API access
        run: |
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" https://api.vercel.com/v2/user)
          echo "API auth check: HTTP $HTTP_CODE"
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID")
          echo "Project lookup: HTTP $HTTP_CODE"

      - name: Pull project settings
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
